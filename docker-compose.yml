services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foyra}
      POSTGRES_DB: ${POSTGRES_DB:-foyra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foyra}:${POSTGRES_PASSWORD:-foyra}@db:5432/${POSTGRES_DB:-foyra}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

  # Base jetable pour `npm test` : docker compose --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: foyra
      POSTGRES_PASSWORD: foyra
      POSTGRES_DB: foyra_test
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
