services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foyra}
      POSTGRES_DB: ${POSTGRES_DB:-foyra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foyra}:${POSTGRES_PASSWORD:-foyra}@db:5432/${POSTGRES_DB:-foyra}
      APP_URL: ${APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      CRON_TOKEN: ${CRON_TOKEN:-}
      TZ: Europe/Paris
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

  # Rapport du soir : appelle la route protégée de l'app à l'heure REPORT_CRON (fuseau Europe/Paris).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      TZ: Europe/Paris
      CRON_TOKEN: ${CRON_TOKEN:-}
      REPORT_CRON: ${REPORT_CRON:-0 20 * * *}
    command: >-
      sh -c 'apk add --no-cache tzdata >/dev/null &&
      echo "$$REPORT_CRON wget -O- --header \"Authorization: Bearer $$CRON_TOKEN\" --post-data \"\" http://app:3000/api/reports/daily 2>&1" > /etc/crontabs/root &&
      crond -f -l 8'

  # Base jetable pour `npm test` : docker compose --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: foyra
      POSTGRES_PASSWORD: foyra
      POSTGRES_DB: foyra_test
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foyra -d foyra_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Vérification de types + tests Vitest dans Docker : docker compose --profile test run --rm tests
  # Le code est monté en direct ; node_modules reste celui de l'image (binaires Linux).
  tests:
    build:
      context: .
      target: dev
    profiles: [test]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL_TEST: postgresql://foyra:foyra@db-test:5432/foyra_test
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run typecheck && npm test"

volumes:
  pgdata:
