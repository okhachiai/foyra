services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-foyra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foyra}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-foyra}
      APP_URL: ${APP_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CRON_TOKEN: ${CRON_TOKEN:-}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-}
      LLM_KEY_SECRET: ${LLM_KEY_SECRET:-}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    image: ${COMPOSE_PROJECT_NAME:-foyra-project}-app
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_TOKEN: ${CRON_TOKEN:-}
    command: ["scripts/report-worker.mjs"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Rapports automatiques (jour ; bilan du mois écoulé le 1er) : appelle la route protégée de l'app à l'heure REPORT_CRON (fuseau Europe/Paris).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      TZ: ${TZ:-Europe/Paris}
      CRON_TOKEN: ${CRON_TOKEN:-}
      REPORT_CRON: ${REPORT_CRON:-0 20 * * *}
    command: >-
      sh -c 'apk add --no-cache tzdata >/dev/null &&
      echo "$$REPORT_CRON wget -O- --header \"Authorization: Bearer $$CRON_TOKEN\" --post-data \"\" http://app:3000/api/reports/daily 2>&1" > /etc/crontabs/root &&
      crond -f -l 8'

  # Base jetable pour `npm test` : docker compose --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: foyra
      POSTGRES_PASSWORD: foyra
      POSTGRES_DB: foyra_test
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foyra -d foyra_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Vérification de types + tests Vitest dans Docker : docker compose --profile test run --rm tests
  # Le code est monté en direct ; node_modules reste celui de l'image (binaires Linux).
  tests:
    build:
      context: .
      target: dev
    profiles: [test]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL_TEST: postgresql://foyra:foyra@db-test:5432/foyra_test
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run typecheck && npm test"

  # Scan DAST OWASP ZAP contre le service interne app (security/audit.sh scan).
  # ZAP_SCRIPT=zap-full-scan.py pour le scan actif ; rapports dans ZAP_OUT.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [audit]
    depends_on: [app]
    volumes:
      - ${ZAP_OUT:-./security-audit/zap}:/zap/wrk:rw
    command: ["${ZAP_SCRIPT:-zap-baseline.py}", "-t", "http://app:3000", "-r", "report.html", "-J", "report.json", "-I"]

volumes:
  pgdata:
